name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 每周一凌晨 03:23（UTC）例行扫描
    - cron: "23 3 * * 1"

permissions:
  contents: read
  # 上传 SARIF 扫描结果到 Security → Code scanning 页需要 write 权限
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 初始化 CodeQL：自动选择 C# 数据库构建方案（本仓库为 .NET SDK 标准构建）
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Autobuild：CodeQL 自动探测 .sln/.csproj 完成编译，无需手写构建命令
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
